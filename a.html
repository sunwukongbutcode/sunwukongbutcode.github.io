<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Successful</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #1a2a3a, #0f1a24);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui;
            color: #eef4ff;
        }
        .protected-card {
            background: rgba(20, 30, 45, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.4);
            border: 1px solid rgba(100, 180, 250, 0.3);
            max-width: 500px;
            width: 90%;
        }
        h1 { font-size: 2rem; margin-bottom: 1rem; background: linear-gradient(135deg, #ffd966, #ffb347); background-clip: text; -webkit-background-clip: text; color: transparent; }
        p { margin: 1rem 0; line-height: 1.5; }
        .success-icon { font-size: 4rem; margin-bottom: 1rem; }
        .note { font-size: 0.8rem; color: #9bb7d0; margin-top: 1.5rem; border-top: 1px solid #2f4b68; padding-top: 1rem; }
    </style>
</head>
<body>
<div class="protected-card" id="content">
    <div class="success-icon"></div>
    <h1>授权访问成功</h1>
    <p>您已通过安全验证</p>
    <a href="mainpage28472.html">点击此处</a> 跳转网站</p>
    <div class="note">会话令牌有效期内可正常访问 · 关闭标签页后需重新登录</div>
</div>

<script>
    (function() {
        const token = sessionStorage.getItem('secure_token');
        const expire = sessionStorage.getItem('token_expire');

        function redirectToLogin() {
            sessionStorage.removeItem('secure_token');
            sessionStorage.removeItem('token_expire');
            window.location.href = "index.html";
        }

        if (!token || !expire) {
            redirectToLogin();
            return;
        }
        const now = Date.now();
        if (now > parseInt(expire, 10)) {
            redirectToLogin();
            return;
        }
        if (token.length < 20) {
            redirectToLogin();
            return;
        }
        
        console.log("会话有效，展示保护内容");
    })();
</script>
</body>
</html>
